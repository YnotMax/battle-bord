name: Albion ZvZ Auto-Crawler (Supabase)

on:
  schedule:
    # ── Cron em UTC ──────────────────────────────────────────────────────────
    # 19:00 UTC = 16:00 BRT (Horário de Brasília)
    # 20:00 UTC = 17:00 BRT (Horário de Brasília)
    # 21:00 UTC = 18:00 BRT (Horário de Brasília)
    - cron: '0 19,20,21 * * *'

  # Permite que você clique em "Run workflow" manualmente no painel do GitHub a qualquer hora
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv
          
      - name: "[Passo 1/2] Sincronizar Batalhas e Participantes (AlbionBB)"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/crawler.py

      - name: "[Passo 2/2] Sincronizar Kill Events e Fases de Combate (Albion API)"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/crawler_kills.py
